[project]
name = "flat-scraper"
version = "0.1.0"
description = "Otodom rental listings monitor with Discord notifications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.10.4,<4.0",
    "discord>=2.3.2",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "parsel>=1.11.0",
    "playwright>=1.62.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flat_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
